<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>Advanced QR Code Generator | Create, Customize & Track QR Codes</title>
  <meta name="description" content="A free, advanced QR code generator to create, customize, and track dynamic QR codes for URLs, Wi-Fi, vCards, and more. Features include custom colors, gradients, logos, and scan tracking.">
  <meta name="keywords" content="qr code generator, free qr code, trackable qr code, custom qr code, qr code with logo, dynamic qr code, qr code marketing, qr code tracking">
  <meta name="robots" content="index, follow">
  <!-- Note: Replace [YOUR_DOMAIN] with your actual website URL for production -->
  <link rel="canonical" href="http://localhost:3000">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://localhost:3000">
  <meta property="og:title" content="Advanced QR Code Generator | Create, Customize & Track QR Codes">
  <meta property="og:description" content="Design and track custom QR codes for free. Add logos, colors, gradients, and monitor scan analytics with our easy-to-use tool.">
  <!-- <meta property="og:image" content="[URL_TO_A_PREVIEW_IMAGE]"> -->

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="http://localhost:3000">
  <meta property="twitter:title" content="Advanced QR Code Generator | Create, Customize & Track QR Codes">
  <meta property="twitter:description" content="Design and track custom QR codes for free. Add logos, colors, gradients, and monitor scan analytics with our easy-to-use tool.">
  <!-- <meta property="twitter:image" content="[URL_TO_A_PREVIEW_IMAGE]"> -->

  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
    .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
    [v-cloak] { display: none; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-4 md:p-8">
    <header class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-2">QR Code Generator</h1>
      <p class="text-slate-600 max-w-2xl mx-auto">Create, customize, and track beautiful QR codes with a live preview.</p>
    </header>

    <main class="grid md:grid-cols-5 gap-8">

      <!-- Left Panel: Controls -->
      <div class="md:col-span-3 bg-white shadow-xl rounded-2xl p-8 space-y-6">
        <div>
          <label class="block font-semibold mb-2 flex items-center"><i data-feather="grid" class="mr-2 h-5 w-5 text-indigo-500"></i>Content Type</label>
          <select id="content-type" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <option value="text">Text / URL</option>
            <option value="image">Image (Upload & Track)</option>
            <option value="wifi">Wi-Fi Network</option>
            <option value="vcard">vCard (Contact)</option>
            <option value="email">Email</option>
          </select>
        </div>

        <!-- Content Input Sections -->
        <div id="text-input-wrapper">
          <label class="block font-semibold mb-2 flex items-center"><i data-feather="link" class="mr-2 h-5 w-5 text-indigo-500"></i>Enter Text / URL</label>
          <textarea id="text-input" rows="4" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400" placeholder="e.g., https://example.com"></textarea>
           <div class="mt-4 flex items-center justify-between bg-indigo-50 p-3 rounded-lg">
                <label for="tracking-enabled" class="font-medium text-sm text-indigo-800 flex items-center"><i data-feather="bar-chart-2" class="mr-2 h-5 w-5"></i>Enable Scan Tracking</label>
                <div class="relative inline-block w-10 mr-2 align-middle select-none">
                    <input type="checkbox" name="tracking-enabled" id="tracking-enabled" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                    <label for="tracking-enabled" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer"></label>
                </div>
            </div>
        </div>

        <div id="image-upload-wrapper" class="hidden">
          <label class="block font-semibold mb-2 flex items-center"><i data-feather="image" class="mr-2 h-5 w-5 text-indigo-500"></i>Upload Image</label>
          <input type="file" id="image-upload" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" accept="image/*">
          <p id="upload-status" class="text-sm text-slate-600 mt-2"></p>
        </div>
        
        <div id="wifi-input-wrapper" class="hidden space-y-4">
            <input type="text" id="wifi-ssid" placeholder="Network Name (SSID)" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <input type="password" id="wifi-password" placeholder="Password" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <select id="wifi-encryption" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
                <option value="WPA">WPA/WPA2</option>
                <option value="WEP">WEP</option>
                <option value="nopass">No Password</option>
            </select>
        </div>

        <div id="vcard-input-wrapper" class="hidden space-y-4">
            <input type="text" id="vcard-name" placeholder="Full Name" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <input type="tel" id="vcard-phone" placeholder="Phone Number" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <input type="email" id="vcard-email" placeholder="Email Address" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
        </div>
        
        <div id="email-input-wrapper" class="hidden space-y-4">
            <input type="email" id="email-to" placeholder="To Email Address" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <input type="text" id="email-subject" placeholder="Subject" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
            <textarea id="email-body" rows="3" placeholder="Email Body" class="w-full px-4 py-2 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400"></textarea>
        </div>

        <!-- Styling Controls -->
        <div class="border-t pt-6 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block font-semibold mb-2 flex items-center"><i data-feather="box" class="mr-2 h-5 w-5 text-indigo-500"></i>Dot Style</label>
                <select id="dot-style" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
                  <option value="square">Square</option>
                  <option value="dots">Dots</option>
                  <option value="rounded" selected>Rounded</option>
                  <option value="extra-rounded">Extra Rounded</option>
                  <option value="classy">Classy</option>
                  <option value="classy-rounded">Classy Rounded</option>
                </select>
              </div>
              <div>
                <label class="block font-semibold mb-2 flex items-center"><i data-feather="shield" class="mr-2 h-5 w-5 text-indigo-500"></i>Error Correction</label>
                <select id="error-correction" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
                  <option value="L">Low (7%)</option>
                  <option value="M" selected>Medium (15%)</option>
                  <option value="Q">Quartile (25%)</option>
                  <option value="H">High (30%)</option>
                </select>
              </div>
            </div>

            <div>
                 <label class="block font-semibold mb-2 flex items-center"><i data-feather="droplet" class="mr-2 h-5 w-5 text-indigo-500"></i>Colors</label>
                 <div class="grid grid-cols-2 gap-4">
                     <div>
                        <label class="block text-sm font-medium mb-1">Foreground</label>
                        <input type="color" id="fg-color" value="#000000" class="w-full h-10 border rounded-xl">
                     </div>
                     <div>
                        <label class="block text-sm font-medium mb-1">Background</label>
                        <input type="color" id="bg-color" value="#ffffff" class="w-full h-10 border rounded-xl">
                     </div>
                 </div>
                 <div class="mt-4 flex items-center justify-between">
                     <div class="flex items-center space-x-2">
                        <input type="checkbox" id="gradient-toggle" class="h-5 w-5 rounded">
                        <label for="gradient-toggle" class="text-sm font-medium">Enable Gradient</label>
                        <input type="color" id="gradient-color" value="#6366f1" class="w-8 h-8 border rounded-lg hidden">
                        <select id="gradient-type" class="px-2 py-1 border rounded-xl bg-slate-50 hidden text-sm">
                            <option value="linear">Linear</option>
                            <option value="radial">Radial</option>
                        </select>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="transparent-bg" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <label for="transparent-bg" class="ml-2 block text-sm font-medium text-slate-700">Transparent BG</label>
                    </div>
                 </div>
            </div>

            <div>
              <label class="block font-semibold mb-2 flex items-center"><i data-feather="star" class="mr-2 h-5 w-5 text-indigo-500"></i>Add Logo</label>
              <input type="file" id="logo-upload" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" accept="image/*">
            </div>
        </div>
      </div>

      <!-- Right Panel: Preview -->
      <div class="md:col-span-2 flex flex-col items-center">
        <div class="bg-white shadow-xl rounded-2xl p-6 sticky top-8 w-full">
            <h3 class="text-center font-bold text-xl mb-4">Live Preview</h3>
            <div id="qr-code" class="bg-white p-4 rounded-2xl shadow-inner border flex items-center justify-center mx-auto"></div>
            <div class="mt-6">
                <label for="download-format" class="block text-sm font-medium text-slate-600 mb-2">Download format</label>
                <div class="flex items-center space-x-2">
                    <select id="download-format" class="w-full px-4 py-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="svg">SVG</option>
                    </select>
                    <button id="download-btn" class="flex-shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-5 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center">
                        <i data-feather="download" class="mr-2 h-5 w-5"></i>Download
                    </button>
                </div>
            </div>
        </div>
      </div>
    </main>

    <!-- My Tracked Links Section -->
    <section class="mt-12 bg-white shadow-xl rounded-2xl p-8">
        <h2 class="text-2xl font-semibold mb-6 flex items-center"><i data-feather="list" class="mr-3 h-6 w-6 text-indigo-500"></i>My Tracked Links</h2>
        <div id="tracked-links-list" class="space-y-4">
            <p class="text-slate-500">Your tracked QR codes will appear here once you create them.</p>
        </div>
    </section>

  </div>

  <script>
    feather.replace();

    const qrCode = new QRCodeStyling({
      width: 280,
      height: 280,
      type: "canvas",
      data: "https://example.com",
      image: "",
      dotsOptions: { color: "#000000", type: "rounded" },
      backgroundOptions: { color: "#ffffff" },
      imageOptions: { crossOrigin: "anonymous", margin: 5 },
      qrOptions: { errorCorrectionLevel: "M" }
    });

    // --- DOM Element References ---
    const qrCodeContainer = document.getElementById("qr-code");
    const downloadBtn = document.getElementById("download-btn");
    const downloadFormat = document.getElementById("download-format");
    const contentType = document.getElementById("content-type");
    const trackingEnabled = document.getElementById("tracking-enabled");
    const trackedLinksList = document.getElementById("tracked-links-list");
    
    const inputWrappers = {
        text: document.getElementById("text-input-wrapper"),
        image: document.getElementById("image-upload-wrapper"),
        wifi: document.getElementById("wifi-input-wrapper"),
        vcard: document.getElementById("vcard-input-wrapper"),
        email: document.getElementById("email-input-wrapper"),
    };

    const allInputs = document.querySelectorAll("input, textarea, select");
    const gradientToggle = document.getElementById("gradient-toggle");
    const gradientColor = document.getElementById("gradient-color");
    const gradientType = document.getElementById("gradient-type");
    const transparentBgCheckbox = document.getElementById("transparent-bg");
    const bgColorInput = document.getElementById("bg-color");
    const textInput = document.getElementById("text-input");

    // --- Initial Setup ---
    qrCode.append(qrCodeContainer);

    // --- Core Functions ---
    const getQrData = async () => {
        const type = contentType.value;
        switch (type) {
            case 'wifi':
                const ssid = document.getElementById('wifi-ssid').value;
                const password = document.getElementById('wifi-password').value;
                const encryption = document.getElementById('wifi-encryption').value;
                return `WIFI:T:${encryption};S:${ssid};P:${password};;`;
            case 'vcard':
                const name = document.getElementById('vcard-name').value;
                const phone = document.getElementById('vcard-phone').value;
                const email = document.getElementById('vcard-email').value;
                return `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
            case 'email':
                const to = document.getElementById('email-to').value;
                const subject = document.getElementById('email-subject').value;
                const body = document.getElementById('email-body').value;
                return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            case 'text':
            case 'image':
            default:
                const originalUrl = textInput.value;
                if ((type === 'text' && trackingEnabled.checked && originalUrl) || type === 'image' && originalUrl) {
                    try {
                        const response = await fetch('/api/shorten', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ originalUrl })
                        });
                        if (!response.ok) throw new Error('Failed to create short link');
                        const data = await response.json();
                        fetchTrackedLinks(); // Refresh the list
                        return data.shortUrl;
                    } catch (error) {
                        console.error('Tracking Error:', error);
                        return originalUrl; // Fallback to original URL
                    }
                }
                return originalUrl || " ";
        }
    };
    
    const updateQRCode = async () => {
      const dotsOptions = {
        type: document.getElementById("dot-style").value,
        color: document.getElementById("fg-color").value
      };
      
      if (gradientToggle.checked) {
        dotsOptions.gradient = {
            type: gradientType.value,
            colorStops: [
                { offset: 0, color: document.getElementById("fg-color").value },
                { offset: 1, color: gradientColor.value }
            ]
        };
      }
      
      const data = await getQrData();

      qrCode.update({
        data,
        dotsOptions,
        backgroundOptions: { color: transparentBgCheckbox.checked ? 'transparent' : bgColorInput.value },
        qrOptions: { errorCorrectionLevel: document.getElementById("error-correction").value }
      });
    };
    
    const fetchTrackedLinks = async () => {
        try {
            const response = await fetch('/api/links');
            const links = await response.json();
            trackedLinksList.innerHTML = ''; // Clear current list
            if (links.length === 0) {
                 trackedLinksList.innerHTML = '<p class="text-slate-500">Your tracked QR codes will appear here once you create them.</p>';
                 return;
            }
            
            const list = document.createElement('ul');
            list.className = 'divide-y divide-slate-200';
            links.forEach(link => {
                const item = document.createElement('li');
                item.className = 'py-3 flex flex-col md:flex-row md:items-center justify-between';
                item.innerHTML = `
                    <div class="flex-grow mb-2 md:mb-0">
                        <p class="font-semibold text-indigo-600">${window.location.origin}/r/${link.short_id}</p>
                        <p class="text-sm text-slate-500 truncate" title="${link.original_url}">${link.original_url}</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-bold text-slate-700">${link.scan_count}</span>
                        <span class="text-sm text-slate-500">Scans</span>
                    </div>
                `;
                list.appendChild(item);
            });
            trackedLinksList.appendChild(list);

        } catch (error) {
            console.error("Failed to fetch links:", error);
            trackedLinksList.innerHTML = '<p class="text-red-500">Could not load tracked links.</p>';
        }
    };

    // --- Event Listeners ---
    allInputs.forEach(input => {
        const isLiveUpdate = input.type !== 'checkbox';
        if (isLiveUpdate) {
             input.addEventListener("input", updateQRCode)
        } else {
             input.addEventListener("change", updateQRCode)
        }
    });

    transparentBgCheckbox.addEventListener('change', () => {
        bgColorInput.disabled = transparentBgCheckbox.checked;
    });

    document.getElementById("logo-upload").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => qrCode.update({ image: reader.result });
      reader.readAsDataURL(file);
    });

    contentType.addEventListener("change", () => {
        Object.values(inputWrappers).forEach(wrapper => wrapper.classList.add("hidden"));
        const currentWrapper = inputWrappers[contentType.value];
        if(currentWrapper) currentWrapper.classList.remove("hidden");
        
        document.getElementById('tracking-enabled').closest('.flex').style.display = contentType.value === 'text' ? 'flex' : 'none';
        
        if (contentType.value !== 'text' && contentType.value !== 'image') {
            textInput.value = '';
        }

        updateQRCode();
    });

    gradientToggle.addEventListener('change', () => {
        const isChecked = gradientToggle.checked;
        gradientColor.classList.toggle('hidden', !isChecked);
        gradientType.classList.toggle('hidden', !isChecked);
        updateQRCode();
    });

    document.getElementById("image-upload").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("image", file);
      
      const statusEl = document.getElementById("upload-status");
      statusEl.textContent = "Uploading image...";
      statusEl.classList.remove('text-red-600');

      fetch("/upload-image", { method: "POST", body: formData })
        .then(res => {
          if (!res.ok) throw new Error(`Upload failed with status: ${res.status}`);
          return res.json();
        })
        .then(data => {
          if (data.imageUrl) {
            textInput.value = data.imageUrl;
            updateQRCode();
            statusEl.textContent = "Upload successful! QR code created.";
          } else { throw new Error("Invalid response from server."); }
        })
        .catch(err => {
          console.error(err);
          statusEl.textContent = "Upload failed. Please try again.";
          statusEl.classList.add('text-red-600');
        });
    });

    downloadBtn.addEventListener("click", () => {
        qrCode.download({ name: "qrcode", extension: downloadFormat.value })
    });
    
    // --- Initial Call ---
    updateQRCode();
    fetchTrackedLinks();
    feather.replace();
  </script>
</body>
</html>
